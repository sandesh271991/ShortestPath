name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install iOS simulator runtime
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS

      - name: Ensure iPhone simulator device
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*(com.apple.CoreSimulator.SimDeviceType.iPhone-[^)]*).*/\1/p' | head -n1)
            RUNTIME_ID=$(xcrun simctl list runtimes | sed -n 's/.*iOS .* (\([^)]*\)).*/\1/p' | head -n1)
            if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME_ID" ]; then
              echo "Unable to determine iPhone device type or iOS runtime."
              xcrun simctl list devicetypes
              xcrun simctl list runtimes
              exit 1
            fi
            xcrun simctl create "CI iPhone" "$DEVICE_TYPE" "$RUNTIME_ID"
          fi

      - name: Resolve simulator destination
        id: destination
        run: |
          ID=$(xcrun simctl list devices available | sed -n 's/.*(\\([0-9A-F-]\\{36\\}\\)).*/\\1/p' | head -n1)
          if [ -z "$ID" ]; then
            echo "No simulator destinations available."
            xcrun simctl list devices
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            -project ShortestPath.xcodeproj \
            -scheme ShortestPath \
            -sdk iphonesimulator \
            -destination "id=${{ steps.destination.outputs.id }}" \
            build

      - name: Test
        run: |
          xcodebuild \
            -project ShortestPath.xcodeproj \
            -scheme ShortestPath \
            -sdk iphonesimulator \
            -destination "id=${{ steps.destination.outputs.id }}" \
            test
